services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2-alpine
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_SERVER_PASSWORD:?set LAVALINK_SERVER_PASSWORD in lavalink.env}
      _JAVA_OPTIONS: ${LAVALINK_JAVA_OPTIONS:--Xms128m -Xmx512m}
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - ./plugins:/opt/Lavalink/plugins
    ports:
      - "${LAVALINK_BIND_ADDRESS:-127.0.0.1}:${LAVALINK_PORT:-2333}:2333"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header="Authorization: $${LAVALINK_SERVER_PASSWORD}"
          http://127.0.0.1:2333/version >/dev/null
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
